<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Ensō no Sato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: #f5f2eb;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 480px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(201, 169, 98, 0.4);
            margin: 2rem auto;
        }

        .icon {
            color: rgba(201, 169, 98, 0.5);
            margin-bottom: 2rem;
        }

        .title {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #f5f2eb;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 1.05rem;
            color: #8a857a;
            font-style: italic;
            line-height: 1.7;
        }

        .back-link {
            display: inline-block;
            margin-top: 2.5rem;
            color: rgba(201, 169, 98, 0.7);
            text-decoration: none;
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #c9a962;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>

        <h1 class="title">Temporarily Closed</h1>
        <div class="divider"></div>
        <p class="message">The admin portal is currently unavailable<br>for Maintenance &amp; Development.</p>

        <a href="/" class="back-link">← Return to Ensō no Sato</a>
    </div>
</body>
</html>
